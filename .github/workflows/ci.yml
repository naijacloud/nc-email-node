name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      # Every supported Node reports, rather than the run stopping at the first
      # failure — a break on 18 only is exactly the thing this matrix exists for.
      fail-fast: false
      matrix:
        node-version: ['18', '20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build

      # The suite binds 127.0.0.1 and never leaves the machine, so a runner with
      # no egress is a valid environment for it.
      - run: npm test
